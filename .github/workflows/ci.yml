# Dedicated CI for jooservices/laravel-logging — GitHub-hosted runners
# Pull-request quality gate: full pipeline. Post-merge heads run ci-post-merge.yml.
name: CI

on:
  pull_request:
    branches: [master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  PHP_VERSION: '8.5'
  MONGODB_URI: mongodb://127.0.0.1:27017
  MONGODB_DATABASE: jooservices_logging_ci

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, json, mongodb
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Composer validate
        run: composer validate --strict

  lint:
    name: Lint (${{ matrix.name }})
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Format sanity
            command: format:sanity
          - name: Pint
            command: lint:pint
          - name: PHPCS
            command: lint:phpcs
          - name: PHPStan
            command: lint:phpstan
          - name: PHPMD
            command: lint:phpmd
          - name: PHP-CS-Fixer
            command: lint:cs
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, json, mongodb
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Run linter
        run: composer ${{ matrix.command }}

  security:
    name: Security (${{ matrix.name }})
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Dependencies
          - name: Secrets
          - name: SAST
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        if: matrix.name == 'Dependencies'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, json, mongodb
          coverage: none

      - name: Install Composer dependencies
        if: matrix.name == 'Dependencies'
        uses: ramsey/composer-install@v4

      - name: Composer audit
        if: matrix.name == 'Dependencies'
        run: composer audit

      - name: OSV Scanner
        if: matrix.name == 'Dependencies'
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --recursive
            .

      - name: Dependency Review
        if: matrix.name == 'Dependencies'
        uses: actions/dependency-review-action@v5

      - name: Gitleaks OSS CLI
        if: matrix.name == 'Secrets'
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            detect --source . --config .gitleaks.toml --redact --exit-code 1

      - name: Semgrep (OSS)
        if: matrix.name == 'SAST'
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/src:ro" \
            semgrep/semgrep@sha256:67319956da3dcb58baf5b322899c15458e3963e7018a86aeeb5cd224e69cb77a \
            semgrep scan --config p/php --error

  test:
    name: Test (${{ matrix.name }})
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Laravel 12
            laravel: '12'
            testbench: '^10.0'
            coverage: true
          - name: Laravel 13
            laravel: '13'
            testbench: '^11.0'
            coverage: false
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, json, mongodb
          coverage: ${{ matrix.coverage && 'pcov' || 'none' }}

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Require Laravel ${{ matrix.laravel }}
        run: |
          composer require --no-update "laravel/framework:^${{ matrix.laravel }}.0"
          composer require --no-update --dev "orchestra/testbench:${{ matrix.testbench }}"
          composer update --prefer-dist --no-interaction

      - name: Run tests with coverage
        if: matrix.coverage
        run: |
          mkdir -p build/coverage
          composer test -- --coverage-clover=build/coverage/clover-Laravel${{ matrix.laravel }}.xml

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: composer test -- --no-coverage

      - name: Upload coverage artifact
        if: matrix.coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-Laravel${{ matrix.laravel }}
          path: build/coverage/clover-Laravel${{ matrix.laravel }}.xml
          if-no-files-found: error

  coverage:
    name: Coverage upload
    needs: [test, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, json, mongodb
          coverage: none

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: build/coverage/matrix
          merge-multiple: true

      - name: Enforce coverage threshold
        run: |
          set -euo pipefail
          clover="build/coverage/matrix/clover-Laravel12.xml"
          php scripts/check-coverage.php 90 "$clover"
          mkdir -p build/coverage
          cp "$clover" build/coverage/clover-combined.xml

      - name: Upload to Codecov
        if: github.event.pull_request.user.type != 'Bot' && env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/coverage/clover-combined.xml
          fail_ci_if_error: true
          verbose: true

      - name: Skip Codecov
        if: env.CODECOV_TOKEN == ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: echo "CODECOV_TOKEN is not configured; skipping Codecov upload."

      - name: Resolve SonarQube host URL
        if: github.event.pull_request.user.type != 'Bot' && env.SONAR_TOKEN != ''
        id: sonar-config
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          set -euo pipefail
          host_url="${SONAR_HOST_URL:-https://sonarcloud.io}"
          host_url="${host_url%/}"
          case "${host_url}" in
            http://*|https://*) ;;
            *) host_url="https://${host_url}" ;;
          esac
          if [[ ! "${host_url}" =~ ^https?://[^[:space:]/]+ ]]; then
            echo "SONAR_HOST_URL must be a valid HTTP(S) URL"
            exit 1
          fi
          echo "host_url=${host_url}" >> "${GITHUB_OUTPUT}"

      - name: Upload SonarQube analysis
        if: github.event.pull_request.user.type != 'Bot' && env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ steps.sonar-config.outputs.host_url }}
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >
            -Dsonar.php.coverage.reportPaths=build/coverage/clover-combined.xml

      - name: Skip SonarQube
        if: env.SONAR_TOKEN == ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: echo "SONAR_TOKEN is not configured; skipping SonarQube analysis."
